<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>咕咕鐘</title>
<!--
  咕咕鐘：認識時鐘的小遊戲
  - 單一 HTML 檔，完全離線可用，不引用任何外部資源
  - 最佳紀錄只存在本機瀏覽器，不蒐集任何個人資料
-->
<style>
:root{
  --wall:#d6e6e1; --wall2:#c9ddd7;
  --wood:#8a5a2e; --wood-d:#5b391b; --wood-l:#c48a4f; --plank:#ecc08c; --plank-d:#b9824a;
  --leaf:#3f7d4e; --leaf-d:#2b5a37;
  --dial:#fffaf0; --ink:#2b1d12; --paper:#fffdf6; --muted:#6f6355;
  --minute:#c8323c; --hour:#2f6b45; --brass:#d9a521;
  --good:#2f8a4f; --warm:#d9731a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:repeating-linear-gradient(90deg, var(--wall) 0 26px, var(--wall2) 26px 28px);
  user-select:none; -webkit-user-select:none;
}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--brass); outline-offset:3px}
[hidden]{display:none !important}

#app{max-width:1080px; margin:0 auto; padding:14px 16px 28px; min-height:100vh; display:flex; flex-direction:column}
.screen{display:none; flex:1; flex-direction:column}
.screen.active{display:flex}

/* ---------- 木牌與按鈕 ---------- */
.plank{
  border:3px solid var(--ink); border-radius:12px; background:var(--plank);
  box-shadow:0 5px 0 var(--plank-d); font-weight:900; padding:10px 16px;
  transition:transform .06s, box-shadow .06s;
}
.plank:active{transform:translateY(4px); box-shadow:0 1px 0 var(--plank-d)}
.plank.small{font-size:15px; padding:7px 12px}
.plank.go{background:var(--leaf); color:#fff; box-shadow:0 5px 0 var(--leaf-d)}
.plank.go:active{box-shadow:0 1px 0 var(--leaf-d)}

/* 招牌：釘在牆上的木牌 */
.sign{
  position:relative; align-self:center; text-align:center; background:var(--wood); color:#fff7e8;
  border:3px solid var(--ink); border-radius:10px; padding:10px 34px 12px; box-shadow:0 6px 0 var(--wood-d);
  margin:6px 0 14px;
}
.sign::before,.sign::after{content:""; position:absolute; top:50%; width:9px; height:9px; margin-top:-4px; border-radius:50%; background:var(--brass); border:2px solid var(--ink)}
.sign::before{left:11px} .sign::after{right:11px}
.sign h1{margin:0; font-size:clamp(30px,8vw,44px); letter-spacing:6px; line-height:1.15}
.sign p{margin:2px 0 0; font-size:15px; font-weight:700; color:#f3dcb8}

/* ---------- 咕咕鐘小屋 ---------- */
.house{display:block; width:100%; height:auto; overflow:visible}
.house .door, .house .bird, .house .bubble, .house .pend{transform-box:view-box}
.house .door{transform-origin:146px 58px; transition:transform .22s ease}
.house .bird{transform-origin:170px 112px; transform:scale(0); transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.house .bubble{opacity:0; transition:opacity .2s}
.house.pop .door{transform:scaleX(.08)}
.house.pop .bird{transform:scale(1.15)}
.house.pop .bubble{opacity:1}
.house.peek .door{transform:scaleX(.08)}
.house.peek .bird{transform:scale(.8)}
.house.peek .bubble{opacity:1}
.house .pend{transform-origin:170px 412px; animation:swing 1.1s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(8deg)} to{transform:rotate(-8deg)}}
.house .minring{opacity:0; transition:opacity .25s}
.house.show-min .minring{opacity:1}
.house .hand-hit{cursor:grab}
.house.dragging .hand-hit{cursor:grabbing}
.house:not(.can-set) .hand-hit{pointer-events:none}
/* 教學用：數字、小格子亮起來，指針變暗或發光 */
.house .num{transition:fill .2s}
.house .num.lit{fill:#d9731a}
.house .tk.lit{stroke:#c8323c; stroke-width:4.5}
.house .hand-h, .house .hand-m{transition:opacity .25s}
.house.dim-h .hand-h, .house.dim-m .hand-m{opacity:.12}
.house.glow-h .hand-h, .house.glow-m .hand-m{filter:drop-shadow(0 0 5px #ffd34d) drop-shadow(0 0 2px #ffd34d)}

/* ---------- 首頁 ---------- */
.home-grid{display:grid; grid-template-columns:1fr; gap:18px; align-items:start}
.hero{max-width:340px; width:72%; margin:0 auto}
.tap-tip{text-align:center; font-size:14px; font-weight:800; color:var(--muted); margin:4px 0 0}
.now{text-align:center; font-weight:900; font-size:19px; margin:4px 0 0; color:var(--wood-d)}
.choose{background:var(--paper); border:3px solid var(--ink); border-radius:16px; padding:16px; box-shadow:0 6px 0 rgba(43,29,18,.18)}
.choose h2{font-size:18px; margin:0 0 10px; color:var(--wood-d)}
.choose h2 + .opts{margin-bottom:18px}
.opts{display:grid; gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  text-align:left; border:3px solid var(--ink); border-radius:12px; background:#fff; padding:10px 12px;
  box-shadow:0 4px 0 #d9cbb6; display:flex; gap:10px; align-items:center;
}
.opt:active{transform:translateY(3px); box-shadow:0 1px 0 #d9cbb6}
.opt .t{font-size:19px; font-weight:900; display:block}
.opt .d{font-size:14px; font-weight:700; color:var(--muted); display:block; margin-top:2px}
.opt .badge{margin-left:auto; font-size:13px; font-weight:900; color:var(--wood-d); background:#f6e6cf; border-radius:999px; padding:3px 9px; white-space:nowrap}
.opt svg{flex-shrink:0}
.opt[aria-pressed="true"]{background:#e6f2e9; border-color:var(--leaf-d); box-shadow:0 4px 0 var(--leaf)}
.opt[aria-pressed="true"] .t{color:var(--leaf-d)}
.start{width:100%; font-size:22px; padding:14px; margin-top:4px}
.fb-link{display:flex; align-items:center; gap:6px; margin:14px auto 0; background:none; border:none; color:var(--muted); font-weight:800; font-size:14px; padding:4px 8px}
.fb-link svg{width:22px; height:22px}
.fb-link:hover{color:var(--wood-d)}
.fb-modal{position:fixed; inset:0; background:rgba(43,29,18,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50}
.fb-box{max-width:420px; width:100%}
.fb-txt{font-weight:700; line-height:1.7; margin:0 0 8px}
.fb-txt.warn{color:var(--warm)}
.fb-txt.small{font-size:14px; color:var(--muted)}
.fb-btns{display:flex; gap:10px; margin-top:12px}
.fb-btns .plank{flex:1; text-align:center; text-decoration:none; color:inherit; font-size:18px}
.fb-btns .plank.go{color:#fff}
body.zy-on .fb-txt{line-height:2.2}
.toggles{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap}

.lesson-btn{width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:#fff3d6; margin-bottom:16px; padding:12px 14px}
.lesson-btn .t{font-size:20px; display:block}
.lesson-btn .d{font-size:14px; color:var(--muted); display:block; margin-top:2px}
.lesson-btn svg{flex-shrink:0}

/* ---------- 教學單元 ---------- */
.l-title{font-size:clamp(21px,5.6vw,26px); font-weight:900; margin:0 0 8px; color:var(--wood-d)}
.l-text{font-size:18px; font-weight:700; line-height:1.75; text-align:left; margin:0}
.l-text .h, .l-read .h{color:var(--hour); font-weight:900} .l-text .m, .l-read .m{color:var(--minute); font-weight:900}
.l-acts{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px}
.l-acts .plank{font-size:17px}
.l-read{min-height:44px; margin-top:12px; font-size:clamp(20px,5.4vw,26px); font-weight:900; color:var(--wood-d); background:#f6efe2; border-radius:12px; padding:8px 12px; line-height:1.5}
.l-read:empty{display:none}
.l-nav{display:flex; gap:10px; margin-top:16px}
.l-nav .plank{flex:1; font-size:18px}
.l-nav .plank:disabled{opacity:.4}
.l-end{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.l-end .plank{font-size:17px}

/* 手機：教學時鐘固定在上方，往下捲看說明時也看得到時鐘 */
@media (max-width:859px){
  #lStage{position:sticky; top:0; z-index:3; width:100%; max-width:none; padding:4px 0 6px;
    background:repeating-linear-gradient(90deg, var(--wall) 0 26px, var(--wall2) 26px 28px)}
  #lStage .house{width:min(56vw, 240px); margin:0 auto}
}

/* ---------- 遊戲 ---------- */
.bar{display:flex; align-items:center; justify-content:space-between; gap:8px 10px; flex-wrap:wrap}
@media (max-width:520px){
  .bar .mini-togs{order:2; margin-left:auto}
  .bar .tagline{order:3}
  .bar .pins{order:4; flex:1; justify-content:flex-end}
  body.zy-on .bar .pins{width:100%; justify-content:center}
}
.pins{display:flex; gap:4px; justify-content:center}
.bar .plank{white-space:nowrap}
.pins i{width:12px; height:12px; flex-shrink:0; border-radius:50%; border:2px solid var(--ink); background:#fff; display:block}
.pins i.ok{background:var(--good)} .pins i.half{background:var(--brass)} .pins i.miss{background:#d9cbb6}
.pins i.now{transform:scale(1.25); background:var(--plank)}
.mini-togs{display:flex; gap:6px}
.tog{min-width:44px; padding:5px 9px !important; font-size:15px !important; line-height:1; display:inline-flex; align-items:center; gap:4px}
.tog svg{width:20px; height:20px}
.tog.off{background:#e9e1d4; color:var(--muted)}
.tagline{font-weight:900; font-size:14px; background:var(--wood); color:#fff7e8; border:2.5px solid var(--ink); border-radius:8px; padding:4px 10px; white-space:nowrap}
.play{display:grid; grid-template-columns:1fr; gap:14px; margin-top:12px; align-items:start}
.stage{max-width:330px; width:78%; margin:0 auto}
.panel{background:var(--paper); border:3px solid var(--ink); border-radius:16px; padding:16px; box-shadow:0 6px 0 rgba(43,29,18,.18); text-align:center}
.prompt{font-size:20px; font-weight:900; margin:0 0 10px}
.target{font-size:clamp(34px,9vw,48px); font-weight:900; margin:0 0 12px; font-variant-numeric:tabular-nums; color:var(--wood-d)}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.answers button{
  border:3px solid var(--ink); border-radius:12px; background:#fff; box-shadow:0 5px 0 #d9cbb6;
  font-size:clamp(20px,5.4vw,26px); font-weight:900; padding:14px 6px; font-variant-numeric:tabular-nums;
}
.answers button:active{transform:translateY(4px); box-shadow:0 1px 0 #d9cbb6}
.answers button.right{background:var(--good); color:#fff; box-shadow:0 5px 0 #1f6036}
.answers button.wrong{background:#f7d9b8; color:#8a4a10; box-shadow:0 5px 0 #d9a066; opacity:.75}
.answers button:disabled{cursor:default}
.adjust{display:grid; grid-template-columns:auto 1fr auto; gap:8px 10px; align-items:center; max-width:360px; margin:0 auto 12px}
.adjust .lab{font-weight:900; font-size:17px; text-align:center}
.adjust .lab.h{color:var(--hour)} .adjust .lab.m{color:var(--minute)}
.adjust button{width:56px; height:48px; font-size:24px; padding:0}
.set-tip{font-size:14px; font-weight:800; color:var(--muted); margin:0 0 10px}
.set-go{width:100%; max-width:360px; font-size:20px}
.feedback{min-height:30px; font-size:21px; font-weight:900; margin-top:12px}
.feedback.good{color:var(--good)} .feedback.warm{color:var(--warm)}
.hint{margin-top:8px; font-size:17px; font-weight:700; line-height:1.7; text-align:left; background:#f6efe2; border-radius:12px; padding:10px 12px}
.hint:empty{display:none}
.hint .h{color:var(--hour); font-weight:900} .hint .m{color:var(--minute); font-weight:900}
.next{margin-top:14px; font-size:19px}

/* ---------- 結果 ---------- */
.result{max-width:560px; margin:10px auto 0; width:100%}
.stars{display:flex; justify-content:center; gap:8px; margin:6px 0}
.stars svg{width:54px; height:54px}
.r-title{font-size:30px; font-weight:900; margin:4px 0; color:var(--wood-d)}
.r-line{font-size:18px; font-weight:800; color:var(--muted)}
.miss-list{margin-top:16px; text-align:left}
.miss-list h3{font-size:17px; margin:0 0 10px}
.minis{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.mini{display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:900; font-size:15px}
.mini svg{width:76px; height:76px}
.r-btns{display:flex; gap:12px; margin-top:20px}
.r-btns .plank{flex:1; font-size:19px}

/* ---------- 注音（直式，跟國語課本一樣） ---------- */
.zc{display:inline-flex; align-items:center; white-space:nowrap; text-indent:0}
.zp{position:relative; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:max(.32em, 8px); line-height:1.05; letter-spacing:0; margin:0 .6em 0 .12em; font-weight:700}
.zp i{display:block; font-style:normal}
.zp .tn{position:absolute; left:100%; bottom:.15em; margin-left:.05em}
.zp .lt{position:absolute; top:-.9em; left:0; right:0; text-align:center}
body.zy-on .hint, body.zy-on .l-text{line-height:2.3}
body.zy-on .l-read{line-height:2}
body.zy-on .opt .d{font-size:15px}
body.zy-on .sign h1{letter-spacing:2px}

/* ---------- 寬螢幕：時鐘在左、題目在右 ---------- */
@media (min-width:860px){
  .home-grid{grid-template-columns:1fr 1.1fr; gap:28px; margin-top:6px}
  .hero{width:100%}
  .play{grid-template-columns:1fr 1.1fr; gap:28px}
  .stage{width:100%; max-width:380px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div id="app">

  <!-- 首頁 -->
  <section id="home" class="screen active">
    <div class="sign"><h1 data-zy="">咕咕鐘</h1><p data-zy="">一起認識時鐘</p></div>
    <div class="home-grid">
      <div>
        <div class="hero" id="heroClock"></div>
        <p class="now" id="nowText"></p>
        <p class="tap-tip" data-zy="">👆 點一下時鐘，小鳥會跑出來喔！</p>
      </div>
      <div class="choose">
        <button class="plank lesson-btn" id="lessonBtn"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 10 C14 6 8 6 4 8 V32 C8 30 14 30 20 34 C26 30 32 30 36 32 V8 C32 6 26 6 20 10Z" fill="#fffaf0" stroke="#2b1d12" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 10 V34" stroke="#2b1d12" stroke-width="2.5"/><circle cx="12" cy="18" r="5" fill="none" stroke="#2f6b45" stroke-width="2"/><path d="M12 18V15M12 18l2 1" stroke="#c8323c" stroke-width="1.8" stroke-linecap="round"/><path d="M24 15h8M24 20h8M24 25h6" stroke="#8a5a2e" stroke-width="2" stroke-linecap="round"/></svg><span><span class="t" data-zy="">教學單元：認識時鐘</span><span class="d" data-zy="">還不會看時鐘？先來上一堂課！</span></span></button>
        <h2 data-zy="">怎麼玩？</h2>
        <div class="opts two" id="modeOpts"></div>
        <h2 data-zy="">選難度</h2>
        <div class="opts" id="levelOpts"></div>
        <button class="plank go start" id="startBtn" data-zy="">開始</button>
        <div class="toggles">
          <button class="plank small" id="soundBtn"></button>
          <button class="plank small" id="zyBtn"></button>
        </div>
        <button class="fb-link" id="fbBtn" aria-label="意見回饋"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="#fffaf0" stroke="#2b1d12" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10h8M8 13h5" stroke="#8a5a2e" stroke-width="1.8" stroke-linecap="round"/></svg><span data-zy="">意見回饋</span></button>
      </div>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="game" class="screen">
    <div class="bar">
      <button class="plank small" id="backBtn" data-zy="">回首頁</button>
      <div class="pins" id="pins"></div>
      <span class="tagline" id="tagline"></span>
      <span class="mini-togs"><button class="plank small tog" data-t="sound"></button><button class="plank small tog" data-t="zy"></button></span>
    </div>
    <div class="play">
      <div class="stage" id="stage"></div>
      <div class="panel">
        <p class="prompt" id="prompt"></p>
        <div class="target" id="target" hidden></div>
        <div class="answers" id="answers"></div>
        <div id="setBox" hidden>
          <div class="adjust">
            <button class="plank" id="hMinus" aria-label="短針往回">−</button><span class="lab h" id="labH"></span><button class="plank" id="hPlus" aria-label="短針往前">＋</button>
            <button class="plank" id="mMinus" aria-label="長針往回">−</button><span class="lab m" id="labM"></span><button class="plank" id="mPlus" aria-label="長針往前">＋</button>
          </div>
          <p class="set-tip" data-zy="">小技巧：點外圈撥長針，點靠近中間的地方撥短針</p>
          <button class="plank go set-go" id="setGo" data-zy="">撥好了</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="hint" id="hint"></div>
        <button class="plank go next" id="nextBtn" hidden></button>
      </div>
    </div>
  </section>

  <!-- 教學單元 -->
  <section id="lesson" class="screen">
    <div class="bar">
      <button class="plank small" id="lessonBack" data-zy="">回首頁</button>
      <div class="pins" id="lPins"></div>
      <span class="tagline" data-zy="">教學：認識時鐘</span>
      <span class="mini-togs"><button class="plank small tog" data-t="sound"></button><button class="plank small tog" data-t="zy"></button></span>
    </div>
    <div class="play">
      <div class="stage" id="lStage"></div>
      <div class="panel">
        <p class="l-title" id="lTitle"></p>
        <p class="l-text" id="lText"></p>
        <div class="l-acts" id="lActs"></div>
        <div class="l-read" id="lRead"></div>
        <div class="l-nav"><button class="plank" id="lPrev"></button><button class="plank go" id="lNext"></button></div>
        <div class="l-end" id="lEnd" hidden><button class="plank" id="goRead"></button><button class="plank" id="goSet"></button></div>
      </div>
    </div>
  </section>

  <!-- 意見回饋 -->
  <div class="fb-modal" id="fbModal" hidden>
    <div class="panel fb-box">
      <p class="prompt" data-zy="">有什麼想法嗎？告訴我們！</p>
      <p class="fb-txt" data-zy="">好玩的地方、看不懂的地方、哪裡怪怪的，都可以寫下來。</p>
      <p class="fb-txt warn" data-zy="">請不要寫下名字、學校、電話這些個人資料喔！</p>
      <p class="fb-txt small" data-zy="">按下去會打開一個新的網頁表單，需要網路。</p>
      <div class="fb-btns"><button class="plank" id="fbClose" data-zy="">先不要</button><a class="plank go" id="fbGo" target="_blank" rel="noopener noreferrer" data-zy="">去寫回饋</a></div>
      <p class="fb-txt small" id="fbNone" hidden data-zy="">（回饋表單還沒設定好）</p>
    </div>
  </div>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="panel result" id="resultBox"></div>
  </section>

</div>

<script>
/* =====================================================================
   設定區
   ===================================================================== */
const TOTAL = 10;   // 一回幾題
/* 意見回饋：Google 表單的網址貼在這裡（留空的話，按鈕會顯示「還沒設定好」） */
const FEEDBACK_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScruXKEE6PUyAwbKz_pbW9mjBErlOV1vO_DhMaotHZZjbhuhg/viewform';
const LEVELS = {
  easy: { name:'簡單', desc:'整點和半點', step:30 },
  mid:  { name:'進階', desc:'5 分 5 分看', step:5 },
  hard: { name:'困難', desc:'1 分 1 分看', step:1 }
};
const MODES = {
  read: { name:'看時鐘', desc:'看指針，選出時間' },
  set:  { name:'撥時鐘', desc:'把指針撥到對的時間' }
};
const PRAISE  = ['咕咕！答對了！','太棒了！','太厲害了！','完全正確！'];
const COMFORT = ['沒關係！','差一點點！','加油，你可以的！','我們再看一次！'];

/* ===== 小工具 ===== */
const $ = function(id){ return document.getElementById(id); };

function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* =====================================================================
   咕咕鐘小屋
   時鐘中心 (170, 270)，半徑 112
   ===================================================================== */
const CX = 170, CY = 270;
function polar(r, deg){ const a = (deg-90)*Math.PI/180; return [CX + r*Math.cos(a), CY + r*Math.sin(a)]; }

function dialSVG(){
  let s = '';
  for(let i=0;i<60;i++){
    const big = i%5===0, p1 = polar(big?92:98, i*6), p2 = polar(104, i*6);
    s += '<line class="tk" data-i="'+i+'" x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="#2b1d12" stroke-width="'+(big?3.5:1.4)+'" stroke-linecap="round"/>';
  }
  for(let n=1;n<=12;n++){
    const p = polar(76, n*30);
    s += '<text class="num" data-n="'+n+'" x="'+p[0].toFixed(1)+'" y="'+(p[1]+8).toFixed(1)+'" text-anchor="middle" font-family="Georgia,\'Times New Roman\',serif" font-weight="700" font-size="24" fill="#2b1d12">'+n+'</text>';
  }
  /* 提示用：外圈的分鐘數 5、10、15…… */
  let r = '<g class="minring">';
  for(let n=1;n<=12;n++){
    const p = polar(124, n*30), v = (n*5)%60;
    r += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="11" fill="#c8323c"/>'
       + '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4.5).toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff" font-family="system-ui,sans-serif">'+(v===0?'0':v)+'</text>';
  }
  return s + r + '</g>';
}

/* 把時鐘指到 h 時 m 分（短針會隨著分鐘慢慢走，跟真的時鐘一樣） */
function setHands(svg, h, m){
  svg.querySelector('.hand-h').setAttribute('transform', 'rotate('+((h%12 + m/60)*30)+' '+CX+' '+CY+')');
  svg.querySelector('.hand-m').setAttribute('transform', 'rotate('+(m*6)+' '+CX+' '+CY+')');
}
function birdSay(svg, text, cls){
  svg.querySelector('.say').textContent = text;
  svg.classList.remove('pop','peek'); void svg.getBoundingClientRect();
  svg.classList.add(cls);
  clearTimeout(svg._t);
  svg._t = setTimeout(function(){ svg.classList.remove('pop','peek'); }, cls==='pop' ? 1500 : 1800);
}

/* 結果頁的小時鐘 */
function miniClock(h, m){
  let t = '';
  for(let n=0;n<12;n++){ const a=(n*30-90)*Math.PI/180; t += '<line x1="'+(50+38*Math.cos(a)).toFixed(1)+'" y1="'+(50+38*Math.sin(a)).toFixed(1)+'" x2="'+(50+44*Math.cos(a)).toFixed(1)+'" y2="'+(50+44*Math.sin(a)).toFixed(1)+'" stroke="#2b1d12" stroke-width="'+(n%3===0?3:1.6)+'"/>'; }
  return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#fffaf0" stroke="#2b1d12" stroke-width="4"/>'+t
    + '<line x1="50" y1="50" x2="50" y2="26" stroke="#2f6b45" stroke-width="6" stroke-linecap="round" transform="rotate('+((h%12+m/60)*30)+' 50 50)"/>'
    + '<line x1="50" y1="50" x2="50" y2="12" stroke="#c8323c" stroke-width="3.5" stroke-linecap="round" transform="rotate('+(m*6)+' 50 50)"/>'
    + '<circle cx="50" cy="50" r="4.5" fill="#d9a521" stroke="#2b1d12" stroke-width="1.5"/></svg>';
}

/* ===== 音效：瀏覽器內建合成 ===== */
let ac = null, soundOn = store.sound !== false;
function tone(freqs, dur, type, gap){
  if(!soundOn) return;
  if(ac && ac.state === 'suspended') ac.resume();
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(function(f,i){
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*(gap||dur);
      o.type = type||'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}
function sCuckoo(){ tone([784,622,784,622], 0.22, 'sine', 0.26); }   // 咕咕、咕咕
function sSoft(){ tone([392,349], 0.14, 'triangle'); }
function sTick(){ tone([1200], 0.03, 'square'); }

function rubyOf(c, z){
  let light = false, toneMark = '';
  if(z.charAt(0)==='˙'){ light = true; z = z.slice(1); }
  if('ˊˇˋ'.indexOf(z.charAt(z.length-1)) >= 0){ toneMark = z.charAt(z.length-1); z = z.slice(0,-1); }
  let col = '';
  for(let k=0;k<z.length;k++){ const ch = z.charAt(k); col += '<i>'+ch+'</i>'; }
  return '<span class="zc">'+c+'<span class="zp">'+(light?'<i class="lt">˙</i>':'')+col+(toneMark?'<i class="tn">'+toneMark+'</i>':'')+'</span></span>';
}
function zy(str){
  return String(str).split(/(<[^>]*>)/).map(function(part){
    if(part.charAt(0)==='<') return part;
    let out = '', i = 0;
    while(i < part.length){
      let hit = null;
      for(const w in ZY_WORDS){ if(part.substr(i,w.length)===w){ hit = w; break; } }
      if(hit){ for(let k=0;k<hit.length;k++) out += rubyOf(hit[k], ZY_WORDS[hit][k]); i += hit.length; continue; }
      const c = part[i]; out += ZY[c] ? rubyOf(c, ZY[c]) : c; i++;
    }
    return out;
  }).join('');
}
function Z(str){ return store.zhuyin ? zy(str) : str; }

function makeOptions(t){
  const list = [{ h:t.h, m:t.m, type:'ok' }];
  function add(h, m, type){
    h = wrapH(h);
    if(m < 0 || m > 59) return;
    if(!list.some(function(o){ return o.h===h && o.m===m; })) list.push({ h:h, m:m, type:type });
  }
  if(level==='easy'){
    add(t.h, t.m===0 ? 30 : 0, 'half');
    if(t.m===30) add(t.h+1, 30, 'near');
    add(t.h+1, t.m, 'next'); add(t.h-1, t.m, 'prev');
  }else{
    if(t.m >= 30) add(t.h+1, t.m, 'near');                                  // 快到整點：看成下一個時
    if(t.m%5===0 && t.m>0){ add(t.m/5, (t.h%12)*5, 'swap'); add(t.h, t.m/5, 'count'); }   // 長短針看反、分鐘直接看數字
    const d = level==='mid' ? 5 : 1;
    add(t.h, t.m+d, 'close'); add(t.h, t.m-d, 'close');
    add(t.h-1, t.m, 'prev');
  }
  let n = 0;
  while(list.length < 4 && n++ < 50) add(randInt(1,12), level==='easy' ? pick([0,30]) : level==='mid' ? randInt(0,11)*5 : randInt(0,59), 'close');
  return shuffle(list.slice(0,4));
}
function nextH(h){ return wrapH(h+1); }

/* ===== 提示 ===== */
const LEGEND = '<span class="h">短針（綠色）</span>指著幾，就是幾時；<span class="m">長針（紅色）</span>指著的地方，看外圈的紅色數字就是幾分。';
function readHint(t, type){
  switch(type){
    case 'near':  return '<span class="h">短針</span>還沒走到 '+nextH(t.h)+'，所以還是 '+t.h+' 時喔！';
    case 'swap':  return '<span class="h">短針</span>比較短，看「時」；<span class="m">長針</span>比較長，看「分」。不要看反了！';
    case 'count': return '<span class="m">長針</span>指著 '+(t.m/5)+'，可是要 5 個 5 個數：5、10、15……，看外圈的紅色數字。';
    case 'half':  return '<span class="m">長針</span>指著 12 是整點；<span class="m">長針</span>指著 6，是過了半圈，就是 30 分。';
    default:      return LEGEND;
  }
}
function setHint(t){
  const tips = [];
  if(setH !== t.h){
    tips.push(t.m===0 ? '<span class="h">短針</span>要指著 '+t.h+'。'
      : '<span class="h">短針</span>要在 '+t.h+' 和 '+nextH(t.h)+' 的中間，因為過了 '+t.h+' 時，還沒到 '+nextH(t.h)+' 時。');
  }
  if(setM !== t.m){
    tips.push(t.m===0 ? '<span class="m">長針</span>要指著 12，才是整點。'
      : '<span class="m">長針</span>要指到外圈紅色數字的 '+(t.m%5===0 ? t.m : (t.m-t.m%5)+' 再走 '+(t.m%5)+' 小格')+'。');
  }
  return tips.join('<br>');
}

/* ----- 看時鐘選時間 ----- */
function answerRead(btn){
  if(locked) return;
  const ok = +btn.dataset.h===q.h && +btn.dataset.m===q.m;
  if(ok){ win(btn); return; }
  btn.classList.add('wrong'); btn.disabled = true;
  if(!q.retry){
    q.retry = true;
    oops(pick(COMFORT) + '看看提示，再試一次！', readHint(q, btn.dataset.type));
  }else{

/* ----- 撥時鐘 ----- */
function updateSetLabels(){
  $('labH').innerHTML = Z('短針：' + setH + ' 時');
  $('labM').innerHTML = Z('長針：' + setM + ' 分');
}
function moveMinute(newM){
  if(newM === setM) return;
  if(setM >= 45 && newM <= 15) setH = wrapH(setH+1);      // 長針往前走過 12，短針跟著進一個時
  else if(setM <= 15 && newM >= 45) setH = wrapH(setH-1); // 長針往回走過 12
  setM = newM; setHands(clock, setH, setM); updateSetLabels(); sTick();
}
function stepMinute(dir){
  if(locked) return;
  const st = LEVELS[level].step;
  let m = setM + dir*st;
  if(m >= 60){ m -= 60; setH = wrapH(setH+1); }
  else if(m < 0){ m += 60; setH = wrapH(setH-1); }
  setM = m; setHands(clock, setH, setM); updateSetLabels(); sTick();
}
function stepHour(dir){ if(locked) return; setH = wrapH(setH+dir); setHands(clock, setH, setM); updateSetLabels(); sTick(); }
$('hMinus').onclick = function(){ stepHour(-1); };
$('hPlus').onclick  = function(){ stepHour(1); };
$('mMinus').onclick = function(){ stepMinute(-1); };
$('mPlus').onclick  = function(){ stepMinute(1); };

/* 拖動指針：長針會對齊每一格（簡單 30 分、進階 5 分、困難 1 分），短針對齊到最近的「時」 */
let dragging = null;
function svgAngle(e){
  const pt = clock.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(clock.getScreenCTM().inverse());
  let a = Math.atan2(p.x - CX, -(p.y - CY)) * 180 / Math.PI;
  return a < 0 ? a + 360 : a;
}
/* 判斷要撥哪一根針：點外圈是長針；點靠近中間的地方，看離哪一根針的方向比較近 */
function pickHand(svg, e, h, m){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const r = Math.hypot(p.x - CX, p.y - CY);
  if(r > 120) return null;                       // 點在鐘面外面
  if(r > 70) return 'm';                         // 外圈：短針碰不到，一定是長針
  let a = Math.atan2(p.x - CX, -(p.y - CY)) * 180 / Math.PI; if(a < 0) a += 360;
  const diff = function(x, y){ const d = Math.abs(x - y) % 360; return d > 180 ? 360 - d : d; };
  return diff(a, ((h%12) + m/60)*30) <= diff(a, m*6) ? 'h' : 'm';
}
clock.addEventListener('pointerdown', function(e){
  if(mode!=='set' || locked) return;
  const hand = pickHand(clock, e, setH, setM);
  if(!hand) return;
  dragging = hand; clock.classList.add('dragging');
  clock.setPointerCapture(e.pointerId); e.preventDefault();
  onSetMove(e);                                  // 點一下也會直接撥過去
});
clock.addEventListener('pointermove', onSetMove);
function onSetMove(e){
  if(!dragging) return;
  const a = svgAngle(e);
  if(dragging==='m'){
    const st = LEVELS[level].step;
    moveMinute((Math.round(a/6/st)*st) % 60);
  }else{
    const h = Math.floor(a/30) || 12;
    if(h !== setH){ setH = h; setHands(clock, setH, setM); updateSetLabels(); sTick(); }
  }
}
function endDrag(){ dragging = null; clock.classList.remove('dragging'); }
clock.addEventListener('pointerup', endDrag);
clock.addEventListener('pointercancel', endDrag);

$('setGo').onclick = function(){
  if(locked) return;
  if(setH===q.h && setM===q.m){ win(null); return; }
  if(!q.retry){
    q.retry = true;
    oops(pick(COMFORT) + '看看提示，再調一次！', setHint(q));
  }else{
    lose();
  }
};

/* ----- 回饋文字：記住原文，切換注音時可以重畫 ----- */
let fbRaw = { cls:'', msg:'', hint:'' };
function paintFb(cls, msg, hint){
  fbRaw = { cls:cls, msg:msg, hint:hint };
  $('feedback').className = 'feedback' + (cls ? ' '+cls : '');
  $('feedback').innerHTML = msg ? Z(msg) : '';
  $('hint').innerHTML = hint ? Z(hint) : '';
}
/* 遊戲進行中切換注音：題目、選項、按鈕文字重新畫，作答進度不變 */
function refreshGameText(){
  if(!$('game').classList.contains('active') || !q) return;
  $('tagline').innerHTML = Z(MODES[mode].name + '・' + LEVELS[level].name);
  if(mode==='read'){
    $('prompt').innerHTML = Z('時鐘上是幾時幾分？');

  }else{

}

/* ----- 答對、答錯 ----- */
function win(btn){
  locked = true;
  if(btn) btn.classList.add('right');
  if(mode==='set') setHands(clock, q.h, q.m);
  results[qi] = q.retry ? 'half' : 'ok';
  birdSay(clock, '咕咕！', 'pop'); sCuckoo();
  paintFb('good', q.retry ? '你自己找到答案了！' : pick(PRAISE), '');
  done();
}
function oops(msg, hintHTML){
  sSoft();
  birdSay(clock, '加油！', 'peek');
  clock.classList.add('show-min');
  paintFb('warm', msg, hintHTML);
}
function lose(){
  locked = true;
  results[qi] = 'miss';
  sSoft();
  birdSay(clock, '沒關係！', 'peek');
  clock.classList.add('show-min');
  if(mode==='read'){
    Array.from($('answers').children).forEach(function(b){ if(+b.dataset.h===q.h && +b.dataset.m===q.m) b.classList.add('right'); });
  }else{
    setH = q.h; setM = q.m; setHands(clock, q.h, q.m); updateSetLabels();
  }
  paintFb('warm', '沒關係！正確的是 ' + fmt(q.h, q.m), LEGEND);
  done();
}
function done(){
  qi++;
  renderPins();
  $('nextBtn').innerHTML = Z(qi >= TOTAL ? '看結果' : '下一題');
  $('nextBtn').hidden = false;
  $('nextBtn').focus({ preventScroll:true });
}
$('nextBtn').onclick = function(){ nextQ(); };

/* ===== 結果 ===== */
function finish(){
  const ok = results.filter(function(r){ return r==='ok'; }).length;
  const half = results.filter(function(r){ return r==='half'; }).length;
  const pts = (ok + half*0.5) / TOTAL;
  const stars = pts>=0.9 ? 3 : pts>=0.7 ? 2 : pts>=0.4 ? 1 : 0;
  const key = mode+'-'+level;
  if(!store.best[key] || stars > store.best[key]) store.best[key] = stars;
  save();
  const missed = [];
  results.forEach(function(r,i){ if(r!=='ok') missed.push(historyQ[i]); });
  let html = '<div class="stars">'+[0,1,2].map(function(i){ return starSVG(i<stars); }).join('')+'</div>'
    + '<div class="r-title">'+['加油，再挑戰一次！','不錯喔！','很厲害！','你是時鐘小達人！'][stars]+'</div>'
    + '<div class="r-line">'+MODES[mode].name+'・'+LEVELS[level].name+'　答對 '+(ok+half)+' / '+TOTAL+' 題'+(half?'（其中 '+half+' 題看了提示）':'')+'</div>';
  if(missed.length){
    html += '<div class="miss-list"><h3>再多看看這幾個時間</h3><div class="minis">'
      + missed.map(function(t){ return '<div class="mini">'+miniClock(t.h,t.m)+'<span>'+fmt(t.h,t.m)+'</span></div>'; }).join('')
      + '</div></div>';
  }
  html += '<div class="r-btns"><button class="plank go" id="againBtn">再玩一次</button><button class="plank" id="homeBtn">回首頁</button></div>';
  $('resultBox').innerHTML = Z(html);
  $('againBtn').onclick = startGame;
  $('homeBtn').onclick = function(){ renderHome(); show('home'); };
  show('result');
  if(stars >= 2){ sCuckoo(); }
}

/* 讓指針平順地從 (h1,m1) 走到 (h2,m2)；系統設定減少動態時直接跳到終點 */
function lGlide(h1, m1, h2, m2, ms, onFrame, done){

    setHands(lc, lH, lM); if(onFrame) onFrame(t);
    if(k < 1) lRaf = requestAnimationFrame(frame); else if(done) done();

      lc.classList.remove('glow-h','glow-m','dim-h','dim-m'); lSet(4, 22);
      lLater(function(){ lc.classList.add('glow-h','dim-m'); lRead('第 1 步：'+H('短針')+'剛走過 4，還沒到 5，所以是 '+H('4 時')); sTick(); }, 300);
      lLater(function(){ lc.classList.remove('glow-h','dim-m'); lc.classList.add('glow-m','dim-h'); for(let i=1;i<=20;i++) litTick(i); lRead('第 2 步：'+M('長針')+'走過 4，5 個 5 個數是 20 分'); sTick(); }, 2600);
      lLater(function(){ litTick(21); litTick(22); lRead('第 3 步：再多走 2 小格，20 + 2 = '+M('22 分')); sTick(); }, 5000);
      lLater(function(){ lc.classList.remove('glow-m','dim-h'); lRead('合起來就是 '+H('4 時')+' '+M('22 分')+'！'); sCuckoo(); birdSay(lc, '咕咕！', 'pop'); }, 7200);
    } }] },
  { t:'9. 自己撥撥看',
    x:'用手指或滑鼠<b>拖動指針</b>（點外圈撥長針、點靠近中間撥短針），也可以按下面的按鈕，時鐘會告訴你現在是幾時幾分。走到整點的時候，咕咕會跑出來喔！',
    setup:function(){ lSet(12, 30); lc.classList.add('can-set','show-min'); lFree = true; freeRead(); },
    acts:[{ n:'長針 −5 分', run:function(){ freeStep(-5); } }, { n:'長針 +1 分', run:function(){ freeStep(1); } }, { n:'長針 +5 分', run:function(){ freeStep(5); } }] }
];
function showHand(k){
  lc.classList.remove('glow-h','glow-m','dim-h','dim-m');
  lc.classList.add(k==='h' ? 'glow-h' : 'glow-m', k==='h' ? 'dim-m' : 'dim-h');
  sTick();
  lRead(k==='h' ? '這是'+H('短針')+'：比較短，看「幾時」' : '這是'+M('長針')+'：比較長，看「幾分」');
}
function freeRead(){ const m = Math.round(lM); lRead('現在是 '+H(lH+' 時')+(m ? ' '+M(m+' 分') : '（整點）')); }
function freeSet(h, m){
  const wasTop = Math.round(lM) === 0;
  lSet(h, m); freeRead(); sTick();
  if(m === 0 && !wasTop){ sCuckoo(); birdSay(lc, '咕咕！', 'pop'); }
}
function freeStep(d){
  let m = Math.round(lM) + d, h = lH;
  if(m >= 60){ m -= 60; h = wrapH(h+1); } else if(m < 0){ m += 60; h = wrapH(h-1); }
  freeSet(h, m);
}
/* 教學時鐘：第 2 步點指針、第 9 步拖指針 */
let lDrag = null;
function lAngle(e){
  const pt = lc.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(lc.getScreenCTM().inverse());
  let a = Math.atan2(p.x - CX, -(p.y - CY)) * 180 / Math.PI;
  return a < 0 ? a + 360 : a;
}
lc.addEventListener('pointerdown', function(e){
  if(!lFree){ const hand = e.target.dataset && e.target.dataset.hand; if(hand) showHand(hand); return; }
  const hand = pickHand(lc, e, lH, Math.round(lM));
  if(!hand) return;
  lDrag = hand; lc.classList.add('dragging'); lc.setPointerCapture(e.pointerId); e.preventDefault();
  onFreeMove(e);
});
lc.addEventListener('pointermove', onFreeMove);
function onFreeMove(e){
  if(!lDrag) return;
  const a = lAngle(e), m0 = Math.round(lM);
  if(lDrag==='m'){
    const m = Math.round(a/6) % 60;
    if(m === m0) return;
    let h = lH;
    if(m0 >= 45 && m <= 15) h = wrapH(h+1); else if(m0 <= 15 && m >= 45) h = wrapH(h-1);
    freeSet(h, m);
  }else{
    const h = Math.floor(a/30) || 12;
    if(h !== lH) freeSet(h, m0);
  }
}
function lEndDrag(){ lDrag = null; lc.classList.remove('dragging'); }
lc.addEventListener('pointerup', lEndDrag);
lc.addEventListener('pointercancel', lEndDrag);

function lessonText(){
  const S = LESSON[lStep];
  $('lTitle').innerHTML = Z(S.t);
  $('lText').innerHTML = Z(S.x);
  Array.from($('lActs').children).forEach(function(b){ b.innerHTML = Z(S.acts[+b.dataset.i].n); });
  $('lRead').innerHTML = Z(lReadRaw);
  $('lPrev').innerHTML = Z('上一步'); $('lNext').innerHTML = Z('下一步');
  $('goRead').innerHTML = Z('去玩看時鐘'); $('goSet').innerHTML = Z('去玩撥時鐘');
}
function renderLesson(){
  lClear();
  const S = LESSON[lStep];
  let pins = '';
  for(let i=0;i<LESSON.length;i++) pins += '<i class="'+(i < lStep ? 'ok' : i===lStep ? 'now' : '')+'"></i>';
  $('lPins').innerHTML = pins;
  $('lTitle').innerHTML = Z(S.t);
  $('lText').innerHTML = Z(S.x);
  $('lActs').innerHTML = S.acts.map(function(a, i){ return '<button class="plank small" data-i="'+i+'">'+Z(a.n)+'</button>'; }).join('');
  Array.from($('lActs').children).forEach(function(b){ b.onclick = function(){ S.acts[+b.dataset.i].run(); }; });
  S.setup();
  $('lPrev').innerHTML = Z('上一步'); $('lPrev').disabled = lStep === 0;
  const last = lStep === LESSON.length-1;
  $('lNext').hidden = last; $('lNext').innerHTML = Z('下一步');
  $('lEnd').hidden = !last;
  $('goRead').innerHTML = Z('去玩看時鐘'); $('goSet').innerHTML = Z('去玩撥時鐘');
}
$('lPrev').onclick = function(){ if(lStep > 0){ lStep--; renderLesson(); } };
$('lNext').onclick = function(){ if(lStep < LESSON.length-1){ lStep++; renderLesson(); window.scrollTo(0,0); } };
$('lessonBtn').onclick = function(){ lStep = 0; show('lesson'); renderLesson(); };
$('lessonBack').onclick = function(){ lClear(); renderHome(); show('home'); };
function goPlay(m){ lClear(); store.mode = m; store.level = 'easy'; save(); startGame(); }
$('goRead').onclick = function(){ goPlay('read'); };
$('goSet').onclick = function(){ goPlay('set'); };

/* ===== 意見回饋 ===== */
$('fbBtn').onclick = function(){
  const ok = /^https:\/\//.test(FEEDBACK_URL);
  $('fbGo').hidden = !ok; $('fbNone').hidden = ok;
  if(ok) $('fbGo').href = FEEDBACK_URL;
  $('fbModal').hidden = false;
};
$('fbClose').onclick = function(){ $('fbModal').hidden = true; };
$('fbGo').addEventListener('click', function(){ setTimeout(function(){ $('fbModal').hidden = true; }, 300); });
$('fbModal').addEventListener('click', function(e){ if(e.target === $('fbModal')) $('fbModal').hidden = true; });

refreshZy();
setInterval(function(){ if($('home').classList.contains('active')) tickNow(); }, 5000);
</script>
